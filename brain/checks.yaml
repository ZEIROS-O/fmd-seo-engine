schema_version: 2

# The check registry — the engine's standing answer to "what should I be checking?"
#
# `fmd-seo beat` reads this, compares each check's cadence against the last
# recorded observation, and emits the due ones with their run instructions.
# `fmd-seo observe` records a result. `fmd-seo assess` evaluates thresholds.
#
# method.kind:
#   http    — free. Fetch the live site. No credentials, no quota, no human.
#   mcp     — Semrush MCP. Callable ONLY from inside a Claude Code session.
#   console — GSC / GA4 / GBP. No MCP exists. See brain/README.md "Human residue".
#   engine  — pure local computation over the repo/corpus.
#   agent   — model judgment + web search. No paid API.
#
# thresholds[].expr is evaluated against the observation's `records` by a
# restricted evaluator (comparisons/boolean ops only — no calls, no attributes).
# Severity: critical > high > medium > low | info.

checks:

  # ─────────────────────────── SCHEMA ───────────────────────────
  - id: schema.presence
    domain: schema
    title: Structured data present in live initial HTML
    cadence: daily
    cost: free
    execution_mode: session
    thesis_refs: [T2]
    instrument_ref: live-html-v1
    method:
      kind: http
      run: |
        Fetch https://freshmobiledetail.com/ and each URL in the sitemap with
        JavaScript disabled (plain curl; no headless browser). Count occurrences of
        `application/ld+json`, `schema.org`, `@type`, and `itemtype` in the raw
        response body. Record per-page and site-wide totals.
        Plain curl is sufficient because TanStack Start renders the JSON-LD
        server-side into the initial HTML response.
        Do NOT count Open Graph or Twitter Card meta — they are not schema.
    records:
      - {name: pages_checked, type: int}
      - {name: pages_with_ld_json, type: int}
      - {name: ld_json_count, type: int}
      - {name: has_localbusiness, type: bool}
      - {name: has_service, type: bool}
      - {name: has_aggregaterating, type: bool}
    thresholds:
      - expr: ld_json_count == 0
        severity: critical
        finding: "Zero structured data site-wide — the T2 finding is still live."
        action: "Work priority 1: emit LocalBusiness/AutoDetailing + Service + AggregateRating on the money pages. This is the highest-leverage open item in the repo."
      - expr: ld_json_count > 0 and has_localbusiness == false
        severity: high
        finding: "Schema exists but no LocalBusiness — entity resolution still unserved."
        action: "Add LocalBusiness/AutoDetailing to the homepage and each money page."
    why: |
      T2. The live TanStack Start site emits JSON-LD in SSR raw HTML. This check
      guards that machine-readable entity surface without introducing a fragile
      headless-browser dependency. AggregateRating stays omitted while the
      business-facts review-count claim gate is closed.

  - id: schema.validate
    domain: schema
    title: Emitted schema is valid and fact-bound
    cadence: weekly
    cost: free
    execution_mode: session
    thesis_refs: [T2, T6]
    instrument_ref: live-html-v1
    method:
      kind: http
      run: |
        For every ld+json block found live, parse it as JSON. Verify: required
        @context/@type, no syntax errors, and that every price / phone / address /
        service name / review count matches the current business-facts.yaml
        snapshot. Report each mismatch as a distinct fact_mismatch entry.
    records:
      - {name: blocks_found, type: int}
      - {name: parse_errors, type: int}
      - {name: fact_mismatches, type: int}
    thresholds:
      - expr: parse_errors > 0
        severity: critical
        finding: "Invalid JSON-LD is worse than none — malformed schema can poison entity resolution."
        action: "Fix or remove the malformed block immediately."
      - expr: fact_mismatches > 0
        severity: critical
        finding: "Live schema contradicts business-facts.yaml — GATE-3 breach."
        action: "BLOCK. Reconcile against business-facts.yaml (facts win) before any other schema work. T6 means answer engines will repeat the wrong fact."
    why: "GATE-3 + T6. Wrong structured data propagates directly into AI answers."

  # ─────────────────────────── SEO ───────────────────────────
  - id: seo.indexation
    domain: seo
    title: GSC index coverage — the GATE-1 input
    cadence: weekly
    cost: console
    execution_mode: scheduled
    thesis_refs: [T1]
    instrument_ref: gsc-url-inspection-v1
    method:
      kind: console
      run: |
        HEADLESS PATH (preferred): `fmd-seo gsc-sync` inspects every sitemap URL
        via the GSC URL Inspection API and records this observation automatically.
        Needs a service-account key (config gsc.key_path) added as a user on the
        property. Index coverage has no bulk API — per-URL inspection IS the method.
        MANUAL FALLBACK (no key): Google Search Console → Indexing → Pages. Record
        Indexed, Not-indexed, and the breakdown ("Discovered – currently not
        indexed", "Crawled – currently not indexed"). See brain/README.md.
    records:
      - {name: indexed, type: int}
      - {name: not_indexed, type: int}
      - {name: discovered_not_indexed, type: int}
      - {name: crawled_not_indexed, type: int}
      - {name: unknown_to_google, type: int}
      - {name: inspected_ok, type: int}
    thresholds:
      - expr: not_indexed >= gate1_not_indexed_max_exclusive
        severity: critical
        finding: "Indexation failing — GATE-1 (publish gate) stays CLOSED."
        action: "No new pages or posts. Route capacity to schema / entity / linking / copy (thesis priority order)."
      - expr: not_indexed < gate1_not_indexed_max_exclusive and indexed >= gate1_indexed_min
        severity: info
        finding: "Indexation recovering — GATE-1 may open after a second consecutive clean weekly reading."
        action: "Re-read next week. Two consecutive clean readings required before authoring resumes."
      - expr: discovered_not_indexed > 10
        severity: high
        finding: "Google is discovering pages and declining to crawl them — a low-authority signal, not a content signal."
        action: "Do not rewrite the pages. Raise corroboration: schema, citations, internal links, reviews."
      - expr: unknown_to_google > 0
        severity: high
        finding: "One or more sitemap URLs are unknown to Google — an authority/discovery gap, not an indexing rejection."
        action: "Verify crawl paths, sitemap delivery, canonicals, and internal links; do not fold these URLs into content-quality remediation."
    why: |
      T1. This is the single measurement that opens or closes GATE-1. Baseline
      2026-07-14: indexed 4, not indexed 18, discovered-not-indexed 14.

  - id: seo.query_footprint
    domain: seo
    title: GSC query footprint and near-winner inventory
    cadence: weekly
    cost: free
    execution_mode: scheduled
    thesis_refs: [T4, T7]
    instrument_ref: gsc-search-analytics-v1
    method:
      kind: engine
      run: |
        Query finalized GSC Search Analytics data over the 28-day period ending
        three days ago twice: once with the query dimension alone, once with
        query and page. Query totals, CTR and position come from the query-only
        dataset because aggregationType auto aggregates by page and would
        double-count a query ranking on two pages; the query/page dataset is used
        only for page coverage and evidence mapping. Reject any row whose
        position is not finite and positive before accumulating its impressions.
        A query whose only row fails that test is dropped from total_queries
        and nonbranded_queries entirely, not only from the position bands.
        A query is branded when it contains the current stem 'fresh mobile',
        the domain stem 'freshmobiledetail', the shorthand 'fresh detail', or
        the retired brand 'drive fresh'; nonbranded_queries counts the rest.
        Page through at most the top 25,000 rows per dataset; persist one
        immutable artifact labelled top_rows carrying both, each with its own
        dimensions.
    records:
      - {name: total_queries, type: int}
      - {name: nonbranded_queries, type: int}
      - {name: queries_pos_1_3, type: int}
      - {name: queries_pos_4_10, type: int}
      - {name: queries_pos_11_20, type: int}
      - {name: impressions_pos_1_3, type: int}
      - {name: impressions_pos_4_10, type: int}
      - {name: impressions_pos_11_20, type: int}
      - {name: impressions_pos_4_20, type: int}
      - {name: ctr_leak_queries, type: int}
      - {name: pages_with_impressions, type: int}
      - {name: pages_in_sitemap, type: int}
    thresholds:
      - expr: queries_pos_4_10 + queries_pos_11_20 > 0
        severity: info
        finding: "A near-winner inventory exists and is the fastest GATE-1-compatible query queue."
        action: "Work mapped positions 4-20 before proposing a new URL."
      - expr: ctr_leak_queries > 0
        severity: medium
        finding: "Queries earn impressions below the CTR floor for their position band."
        action: "Patch the mapped existing page title, opening answer, or snippet alignment."
    why: "T7 retired the Semrush domain estimate; first-party GSC rows are the authoritative footprint."

  - id: seo.positions
    domain: seo
    title: Position tracking against the 467-keyword master list
    cadence: weekly
    cost: paid
    execution_mode: scheduled
    thesis_refs: [T5, T7]
    instrument_ref: dataforseo-serp-v1
    method:
      kind: engine
      run: |
        Run the resumable DataForSEO standard-queue SERP bulk path over
        evidence/keywords/position-tracking-keywords.txt at the configured
        operating coordinate, mobile, depth 20. Record measured rank counts.
        Never substitute estimates when the provider is unavailable (GATE-4).
    records:
      - {name: blocked, type: bool}
      - {name: keywords_tracked, type: int}
      - {name: keywords_missing, type: int}
      - {name: top10_count, type: int}
      - {name: top3_count, type: int}
      - {name: top20_count, type: int}
    thresholds:
      - expr: blocked == true
        severity: critical
        finding: "The weekly position dataset could not be measured."
        action: "Surface the provider failure through sync.health; never estimate rankings."
    why: "Coordinate-accurate trend detection for the master list. Honest-blocked beats invented numbers (GATE-4)."

  - id: seo.map_pack
    domain: seo
    title: Map-pack visibility across the service-area geogrid
    cadence: weekly
    cost: paid
    execution_mode: scheduled
    thesis_refs: [T5]
    instrument_ref: dataforseo-serp-v1
    method:
      kind: engine
      run: |
        Sample the configured 5x5 service-area grid for the core money queries,
        mobile. Record the median FMD rank among present points, the number of
        sampled/present points, and competitors ranked above FMD.
    records:
      - {name: queries, type: int}
      - {name: points_sampled, type: int}
      - {name: points_missing, type: int}
      - {name: points_present, type: int}
      - {name: median_rank, type: float}
      - {name: competitors_above, type: int}
    thresholds:
      - expr: points_present == 0
        severity: high
        finding: "FMD is absent from every sampled map-pack point."
        action: "Prioritize entity consistency, review velocity, and GBP completeness; do not add pages."
    why: "The map pack is the primary discovery surface for a mobile local-service business; a single point is too noisy to govern decisions."

  - id: seo.local_visibility
    domain: seo
    title: Places-tab rank across the keyword x suburb matrix
    cadence: weekly
    cost: paid
    execution_mode: session
    thesis_refs: [T5]
    instrument_ref: dataforseo-local-finder-v1
    method:
      kind: engine
      run: |
        Run `fmd-seo local-finder --run` over config/engine.yaml → local_finder
        (keyword templates x suburb locations, Places tab, depth 20, mobile).
        Record how many pairs rank at all, how many reach the 3-slot pack, and
        the best rank observed. Never substitute an estimate for an absent
        measurement (GATE-4).
    records:
      - {name: pairs_tested, type: int}
      - {name: pairs_ranked, type: int}
      - {name: pairs_in_pack, type: int}
      - {name: best_rank, type: int}
      - {name: reviews, type: int}
    thresholds:
      - expr: pairs_ranked == 0
        severity: critical
        finding: "FMD ranks nowhere in the Places tab across the whole matrix."
        action: "Verify the GBP is live, verified, and correctly categorized before any content or link work."
      - expr: pairs_ranked > 0 and pairs_in_pack == 0
        severity: high
        finding: "FMD ranks in the Places tab but reaches no 3-slot pack — invisible on normal web searches."
        action: "Prominence work: review velocity and citation consistency. Rank 4-6 is a near miss, not an absence."
      - expr: pairs_ranked > 0 and pairs_ranked * 3 < pairs_tested
        severity: high
        finding: "Visibility is confined to a narrow ring around the profile's anchor."
        action: "The ring widens with prominence, not with pages. Reviews and citations before content."
    why: |
      Measured 2026-08-03: the 3-slot pack probe reported points_present 0 across
      181 samples while FMD actually held rank 2 in Mayfield Heights, 6 in
      Beachwood, and nothing in Solon. Depth 20 is what makes a ring visible;
      a 3-slot probe cannot tell "rank 6" from "does not exist".

  - id: gbp.performance
    domain: seo
    title: Google Business Profile discovery and conversion actions
    cadence: weekly
    cost: free
    # session, not scheduled: the API path has no possible producer. The
    # Business Profile Performance / Business Information / Account Management
    # APIs are all disabled in Cloud project local-lead-machine-498016, and the
    # unobfuscated location id the Performance API needs is only obtainable from
    # accounts.locations.list on one of them. Measured 2026-08-17; see
    # brain/blockers/gbp-performance.md. Lou reads the dashboard until access
    # lands, then this returns to scheduled with a producers.yaml entry.
    execution_mode: session
    thesis_refs: [T5]
    instrument_ref: gbp-performance-v1
    method:
      kind: engine
      run: |
        Read the prior 28 days from the Google Business Profile dashboard
        (Performance -> Calls, Directions, Website clicks) and record them with
        `fmd-seo observe`. Sum call clicks, direction requests, and website
        clicks. Separately classify calendar-month search-keyword impressions as
        discovery when non-branded; count threshold-only keyword rows without
        converting their unknown values to zero-measured impressions.
        The headless path (gbp.sync_if_due) stays in place and needs only
        gbp.location_id plus API access; until then it is not the producer.
    records:
      - {name: calls, type: int}
      - {name: direction_requests, type: int}
      - {name: website_clicks, type: int}
      - {name: searches_discovery, type: int}
      - {name: search_keywords_thresholded, type: int}
    thresholds:
      - expr: calls + direction_requests + website_clicks == 0
        severity: high
        finding: "GBP produced no recorded customer actions in the measurement window."
        action: "Verify the profile and measurement connection before using GBP performance in decisions."
    why: "Discovery searches and profile actions are the closest first-party measures of map-pack visibility and business impact."

  - id: analytics.traffic
    domain: analytics
    title: GA4 acquisition and conversion measurement
    cadence: weekly
    cost: free
    execution_mode: scheduled
    thesis_refs: [T6]
    instrument_ref: ga4-data-v1
    method:
      kind: console
      run: |
        Fetch a read-only 28-day GA4 Data API report grouped by session source
        and default channel group. Record total, engaged, organic-search, known
        AI-referral sessions, and key events without estimating missing data.
    records:
      - {name: sessions, type: int}
      - {name: engaged_sessions, type: int}
      - {name: organic_search_sessions, type: int}
      - {name: ai_referral_sessions, type: int}
      - {name: key_events, type: int}
    thresholds:
      - expr: sessions > 0 and key_events == 0
        severity: high
        finding: "GA4 records traffic but no key events, so acquisition cannot be tied to business outcomes."
        action: "Design and verify booking conversion measurement before optimizing traffic sources."
    why: "First-party acquisition and conversion measurement prevents rankings or clicks from becoming outcome proxies."

  - id: seo.site_health
    domain: seo
    title: Semrush Site Audit health and errors
    cadence: weekly
    cost: mcp
    execution_mode: session
    thesis_refs: [T2]
    instrument_ref: semrush-site-audit-v1
    method:
      kind: mcp
      run: |
        mcp__semrush__site_audit for project 30426612. Record health score, errors,
        warnings, notices, pages crawled, broken pages. Compare to the prior
        observation and flag any *new* error class.
    records:
      - {name: health_score, type: int}
      - {name: errors, type: int}
      - {name: warnings, type: int}
      - {name: pages_crawled, type: int}
    thresholds:
      - expr: errors > 0
        severity: high
        finding: "Site audit errors appeared — the site was 0-error at baseline."
        action: "Triage before any content work; a regression here is cheap to fix and expensive to ignore."
      - expr: health_score < 90
        severity: medium
        finding: "Site health dropped below the 95 baseline."
        action: "Diff against the prior snapshot to isolate the regression."
    why: "T2 baseline: health 95/100, 0 errors, 47 warnings, 22 pages crawled."

  - id: seo.internal_links
    domain: seo
    title: Internal link paths to the unindexed pages
    cadence: weekly
    cost: free
    execution_mode: session
    thesis_refs: [T1]
    instrument_ref: live-crawl-v1
    method:
      kind: http
      run: |
        Crawl the live sitemap. For each URL, count inbound internal links from
        other pages. Flag any URL reachable only from the sitemap (orphan) — e.g.
        /chat was orphaned at baseline. Crawl priority follows internal links, and
        the 14 unindexed pages are link-starved.
    records:
      - {name: urls_in_sitemap, type: int}
      - {name: orphan_count, type: int}
      - {name: min_inbound_links, type: int}
    thresholds:
      - expr: orphan_count > 0
        severity: high
        finding: "Orphaned URLs in the sitemap — submitted for indexing with no internal link equity."
        action: "Link them from a crawlable nav or hub page, or remove them from the sitemap. Thesis priority 4."
    why: "T1. Internal links are a free crawl-priority lever on the 14 unindexed pages."

  - id: local.review_velocity
    domain: local
    title: FMD and competitor review floor and velocity
    cadence: weekly
    cost: paid
    execution_mode: session
    thesis_refs: [T5, T6, T7]
    instrument_ref: dataforseo-local-finder-v1
    method:
      kind: engine
      run: |
        Record FMD and the current top-three local competitors' rating and review
        count. Compare with the nearest prior observation 25-35 days old; missing
        prior data is null, never zero.
    records:
      - {name: prior_measured, type: bool}
      - {name: net_velocity_positive, type: bool}
      - {name: fmd_reviews, type: int}
      - {name: fmd_rating, type: float}
      - {name: fmd_new_reviews_28d, type: int, nullable: true}
      - {name: competitor_median_reviews, type: int}
      - {name: competitor_median_new_reviews_28d, type: int, nullable: true}
      - {name: pack_floor_reviews, type: int}
      - {name: reviews_to_floor, type: int}
      - {name: static_months_to_floor, type: float, nullable: true}
      - {name: net_months_to_floor, type: float, nullable: true}
    thresholds:
      - expr: fmd_reviews < pack_floor_reviews
        severity: high
        finding: "FMD remains below the observed review floor among ranked local competitors."
        action: "Keep review velocity as an accountable Lou-owned priority; do not invent a shortcut."
      - expr: prior_measured == true and fmd_new_reviews_28d == 0
        severity: critical
        finding: "Measured review velocity is zero."
        action: "Escalate the existing review process; do not treat a missing prior reading as zero."
      - expr: prior_measured == true and net_velocity_positive == false
        severity: high
        finding: "FMD is not closing the review floor at the competitors' measured velocity."
        action: "net_months_to_floor remains unmeasurable until FMD outpaces the competitor median."
    why: "T5 and T6 show the same review corroboration gate on the map pack and answer-engine surfaces."

  - id: local.review_language
    domain: local
    title: Capped customer and competitor review-language sample
    cadence: monthly
    cost: paid
    execution_mode: session
    thesis_refs: [T4, T5]
    instrument_ref: dataforseo-google-reviews-v1
    method:
      kind: engine
      run: |
        Plan and reserve spend before retrieving at most the newest 20 FMD
        reviews and 20 for each top-three competitor. Persist source text and
        derive only repeated phrases present in the captured reviews.
    records:
      - {name: businesses_sampled, type: int}
      - {name: reviews_captured, type: int}
      - {name: repeated_problem_phrases, type: int}
    thresholds:
      - expr: businesses_sampled < 4
        severity: high
        finding: "The review-language panel is incomplete."
        action: "Do not generalize customer language from a partial competitor set."
    why: "Observed customer language feeds existing-page copy without model-invented phrasing."

  # ─────────────────────────── AEO ───────────────────────────
  - id: aeo.answer_accuracy
    domain: aeo
    title: Do AI answers cite FMD, and are the cited facts correct?
    cadence: weekly
    cost: free
    execution_mode: session
    thesis_refs: [T6]
    instrument_ref: dataforseo-llm-responses-v1
    method:
      kind: agent
      run: |
        Run the standing AEO query set (brain/state.yaml → aeo_query_set) through
        live web search and capture AI answer summaries. For each: does it mention
        FMD, and are the cited facts (prices, guarantee, process, service area)
        correct against business-facts.yaml?
        Record a wrong_facts entry for each incorrect cited fact, with the query
        and the exact wrong value. Label everything with retrieval time (GATE-4).
    records:
      - {name: queries_run, type: int}
      - {name: queries_citing_fmd, type: int}
      - {name: wrong_facts, type: int}
    thresholds:
      - expr: wrong_facts > 0
        severity: critical
        finding: "An AI answer is citing an incorrect FMD fact — answer-engine drift."
        action: "Trace the wrong value to its published source and correct it there. This is why T6 makes AEO a defend job."
      - expr: queries_citing_fmd == 0
        severity: high
        finding: "FMD dropped out of AI answers entirely — regression against the T6 baseline."
        action: "Check entity consistency and schema first; citation loss usually follows entity confusion."
    why: |
      T6. AI answers already cite FMD accurately (pricing, Door-Open Guarantee,
      47-point reset, text-3-photos flow). The job is defend-and-extend; the live
      risk is drift, not absence.

  - id: aeo.recommendation_share
    domain: aeo
    title: Frozen multi-engine recommendation share
    cadence: weekly
    cost: paid
    execution_mode: session
    thesis_refs: [T6]
    instrument_ref: dataforseo-llm-responses-v1
    method:
      kind: engine
      run: |
        Run the frozen 25-query v1 panel through ChatGPT and Perplexity twice
        per query only after the measured 20-response canary and recurring-cost
        gate are approved. Preserve provider/model labels and raw response refs.
    records:
      - {name: responses_expected, type: int}
      - {name: responses_captured, type: int}
      - {name: fmd_mentions, type: int}
      - {name: fmd_ranked_mentions, type: int}
      - {name: fmd_mean_position, type: float, nullable: true}
    thresholds:
      - expr: responses_captured < responses_expected
        severity: critical
        finding: "The standing AEO panel is incomplete."
        action: "Do not calculate share from a partial denominator."
      - expr: responses_captured == responses_expected and fmd_ranked_mentions == 0
        severity: high
        finding: "FMD is never a ranked recommendation in the complete panel."
        action: "Inspect verified review-floor and citation-source evidence before proposing content."
    why: "Recommendation order is a different outcome from factual accuracy or citation share."

  - id: aeo.review_floor
    domain: aeo
    title: Verified review floor among ranked AEO businesses
    cadence: weekly
    cost: free
    execution_mode: session
    thesis_refs: [T6]
    instrument_ref: dataforseo-llm-responses-v1
    method:
      kind: engine
      run: |
        Verify every review count asserted for ranked businesses against the
        listing source. Never treat an answer-engine assertion as a verified fact.
    records:
      - {name: ranked_businesses_verified, type: int}
      - {name: fmd_reviews, type: int}
      - {name: ranked_competitor_min_reviews, type: int}
      - {name: ranked_competitor_median_reviews, type: int}
      - {name: ranked_competitor_max_reviews, type: int}
      - {name: reviews_to_floor, type: int}
    thresholds:
      - expr: ranked_businesses_verified > 0 and reviews_to_floor > 0
        severity: high
        finding: "FMD remains below the verified answer-engine review floor."
        action: "Route to the review-velocity owner; do not patch an unverified count into site copy."
    why: "Makes the 16-versus-ranked-competitor review gap a standing measurable fact."

  - id: aeo.citation_sources
    domain: aeo
    title: Answer-engine citation source map
    cadence: weekly
    cost: free
    execution_mode: session
    thesis_refs: [T6, T7]
    instrument_ref: dataforseo-llm-responses-v1
    method:
      kind: engine
      run: |
        Record each cited URL/domain, citation frequency, and whether it supports
        FMD, competitors, or both. Keep citations separate from recommendations.
    records:
      - {name: sources_captured, type: int}
      - {name: distinct_domains, type: int}
      - {name: sources_citing_fmd, type: int}
      - {name: sources_citing_competitors_only, type: int}
    thresholds:
      - expr: sources_citing_competitors_only > 0
        severity: info
        finding: "Repeated cited sources support competitors but not FMD."
        action: "Add qualified, evidence-linked sources to the draft citation-entry queue; no automated outreach."
    why: "Citation frequency and recommendation share are separate AEO mechanisms."

  - id: aeo.entity_consistency
    domain: aeo
    title: NAP consistency and 'Drive Fresh' contamination sweep
    cadence: monthly
    cost: free
    execution_mode: session
    thesis_refs: [T8]
    instrument_ref: agent-search-v1
    method:
      kind: agent
      run: |
        Search the business name, phone, and legacy 'Drive Fresh' / drivefreshdetail.com
        across social profiles and directory listings. Record each surface where the
        name/phone/address disagrees with business-facts.yaml, and each surface still
        carrying 'Drive Fresh'.
    records:
      - {name: surfaces_checked, type: int}
      - {name: nap_mismatches, type: int}
      - {name: drivefresh_contaminated, type: int}
    thresholds:
      - expr: drivefresh_contaminated > 0
        severity: high
        finding: "'Drive Fresh' naming still present — split identity suppresses entity resolution."
        action: "Collapse to 'Fresh Mobile Detailing'. Thesis priority 2. Free fix, direct T1 lever."
      - expr: nap_mismatches > 0
        severity: high
        finding: "NAP disagreement across citations — the exact signal that keeps a young entity unresolved."
        action: "Correct each surface to match business-facts.yaml."
    why: "T8. drivefreshdetail.com is Lou's own legacy domain; contamination is self-inflicted and free to fix."

  # ─────────────────────── COMPETITOR ───────────────────────
  - id: competitor.authority_gap
    domain: competitor
    title: Authority Score gap vs the local set
    cadence: weekly
    cost: mcp
    # scheduled: `fmd-seo sync --source semrush` (sync.sync_due) has
    # fetched and recorded this autonomously since the Semrush adapters
    # landed. It was marked `session` while the cron was already producing
    # it, which kept it off the freshness watchdog. See brain/producers.yaml.
    execution_mode: scheduled
    thesis_refs: [T7]
    instrument_ref: semrush-backlinks-v1
    method:
      kind: mcp
      run: |
        mcp__semrush__backlinks_research for freshmobiledetail.com and each domain
        in brain/state.yaml → competitor_set. Record AS, backlinks, referring
        domains for each. Compute our AS and the set median.
    records:
      - {name: our_authority_score, type: int}
      - {name: competitor_median_as, type: int}
      - {name: our_referring_domains, type: int}
    thresholds:
      - expr: our_authority_score <= 3
        severity: high
        finding: "Authority Score still at/near the AS-2 baseline — the binding constraint per T7."
        action: "Local corroboration (reviews, citations, schema), NOT link volume. We already out-link Refresh (211/106 vs 31/21) and still trail their AS 7."
      - expr: our_authority_score > competitor_median_as
        severity: info
        finding: "Authority parity with the local set reached — a genuine regime change."
        action: "Re-evaluate GATE-1 and the whole thesis priority order; the T1/T7 constraint may no longer bind."
    why: "T7. AS 2 vs 7-16. Raw link counts already exceed some competitors — quality/corroboration is the gap, not volume."

  - id: competitor.serp_movement
    domain: competitor
    title: Who holds the city-level SERP
    cadence: weekly
    cost: paid
    execution_mode: scheduled
    thesis_refs: [T5]
    instrument_ref: dataforseo-serp-v1
    method:
      kind: engine
      run: |
        Reuse the weekly coordinate-anchored mobile `serp-bulk` dataset at zero
        marginal cost. For brain/state.yaml head_terms, record FMD page-one
        appearances and domains not present in the prior comparable panel.
    records:
      - {name: head_terms_checked, type: int}
      - {name: fmd_page1_count, type: int}
      - {name: new_entrants, type: int}
    thresholds:
      - expr: fmd_page1_count > 0
        severity: info
        finding: "FMD broke onto a city-level page 1 — first movement against T5."
        action: "Identify which term and why; that is the replicable pattern."
    why: "T5. City-level page one is currently ATF, It's A Wash, Zayas, Detail Dash, Panda Hub, Yelp, aggregators — FMD absent."

  - id: serp.consensus
    domain: competitor
    title: Top-ten SERP consensus and beatability
    cadence: monthly
    cost: paid
    execution_mode: session
    thesis_refs: [T4, T7]
    instrument_ref: dataforseo-serp-v1
    method:
      kind: agent
      run: |
        Recollect existing task IDs before posting. Persist top-ten URL, title,
        snippet, rank, result type, and features; fetch winners and require six
        accessible pages before declaring consensus.
    records:
      - {name: head_terms_checked, type: int}
      - {name: complete_consensus_artifacts, type: int}
      - {name: inaccessible_winners, type: int}
    thresholds:
      - expr: complete_consensus_artifacts == 0
        severity: high
        finding: "No query has a complete six-winner SERP consensus artifact."
        action: "Do not pass PagePackage GATE-3 without consensus and information gain."
    why: "The SERP is the answer key; purchased result payloads must not be discarded."

  - id: authority.cited_sources
    domain: authority
    title: Qualified answer-engine citation-entry queue
    cadence: monthly
    cost: free
    execution_mode: session
    thesis_refs: [T7]
    instrument_ref: agent-search-v1
    method:
      kind: agent
      run: |
        Rank captured citation sources by frequency, buyer relevance, and
        inclusion feasibility. Produce research and draft next actions only.
    records:
      - {name: sources_ranked, type: int}
      - {name: sources_with_competitor_no_fmd, type: int}
      - {name: enterable_sources, type: int}
    thresholds:
      - expr: enterable_sources > 0
        severity: info
        finding: "Qualified citation-source entries are available for human review."
        action: "Prepare accurate drafts; no cold outreach, purchase, or automated submission."
    why: "Citation-source authority is distinct from generic link volume."

  - id: authority.local_corroboration
    domain: authority
    title: Allowlisted local corroboration gaps
    cadence: monthly
    cost: free
    execution_mode: session
    thesis_refs: [T5, T7, T8]
    instrument_ref: agent-search-v1
    method:
      kind: agent
      run: |
        Audit allowlisted chambers, associations, suppliers, directories, and
        community sources. Record true competitor presence and NAP facts only.
    records:
      - {name: surfaces_audited, type: int}
      - {name: competitor_present_fmd_absent, type: int}
      - {name: nap_consistent, type: bool}
    thresholds:
      - expr: competitor_present_fmd_absent > 0
        severity: info
        finding: "Allowlisted local corroboration sources include competitors but not FMD."
        action: "Queue a human-reviewed correction or entry draft; never invent corroboration."
    why: "Local prominence can improve through true corroboration without reviving generic backlink campaigns."

  # ──────────────────────── MARKET ────────────────────────
  - id: market.demand
    domain: market
    title: Demand cluster volumes and seasonality
    cadence: monthly
    cost: mcp
    # scheduled: `fmd-seo sync --source semrush` (sync.sync_due) has
    # fetched and recorded this autonomously since the Semrush adapters
    # landed. It was marked `session` while the cron was already producing
    # it, which kept it off the freshness watchdog. See brain/producers.yaml.
    execution_mode: scheduled
    thesis_refs: [T3]
    instrument_ref: semrush-keywords-v1
    method:
      kind: mcp
      run: |
        mcp__semrush__keyword_research over the demand clusters in
        brain/state.yaml → demand_clusters. Record volume per cluster and the
        trend direction. Detailing is seasonal — record the monthly trend array,
        do not average it away.
    records:
      - {name: near_me_volume, type: int}
      - {name: clusters_checked, type: int}
      - {name: trend_direction, type: str}
    thresholds:
      - expr: near_me_volume < 1500
        severity: medium
        finding: "The 'near me' cluster fell well below its 2,350/mo baseline."
        action: "Check for seasonality before treating it as decay — verify against the monthly trend array, not a single reading."
    why: "T3. 'near me' cluster = 2,350/mo and is where the demand actually lives."

  - id: facts.freshness
    domain: facts
    title: Business-facts review window
    cadence: daily
    cost: free
    execution_mode: scheduled
    thesis_refs: [T6]
    instrument_ref: facts-yaml-v1
    method:
      kind: engine
      run: |
        Read business-facts.yaml reviewed_at and review_after_days. Record the
        number of calendar days until the review deadline. Do not advance
        reviewed_at without Lou's explicit re-review.
    records:
      - {name: days_until_stale, type: int}
    thresholds:
      - expr: days_until_stale <= 0
        severity: critical
        finding: "business-facts.yaml is at or past its review deadline."
        action: "BLOCK fact-bound generation until Lou re-reviews and advances reviewed_at."
      - expr: days_until_stale > 0 and days_until_stale <= 7
        severity: high
        finding: "business-facts.yaml will become stale within seven days."
        action: "Schedule Lou's fact review before the hard preflight block."
    why: "Turns the 30-day fact staleness cliff into a visible seven-day warning ramp."

  - id: sync.health
    domain: engine
    title: Headless data-sync health
    cadence: daily
    cost: free
    execution_mode: scheduled
    thesis_refs: [T1]
    instrument_ref: observation-series-v1
    method:
      kind: engine
      run: |
        After every headless sync attempt, record how many due checks were
        attempted, succeeded, and failed, plus a per-source status line.
        Provider errors are findings, not transient console text, and a missing
        credential is a failure rather than a silent skip. Recorded on every run
        where a source was selected, including the all-not_due day, so the daily
        cadence cannot go stale and read as healthy.
    records:
      - {name: checks_attempted, type: int}
      - {name: checks_succeeded, type: int}
      - {name: checks_failed, type: int}
      # semrush=failed;ga4=ok;gbp=not_due;site=no_credential -- the aggregate
      # counts say a run degraded, this says which provider did.
      - {name: source_status, type: str}
    thresholds:
      - expr: checks_failed > 0
        severity: critical
        finding: "One or more headless data checks failed during sync."
        action: "Inspect the sync receipt and provider health; do not report the run healthy."
    why: "A fetch failure must become a standing finding so the autonomous loop cannot fail quietly."

  - id: site.facts_drift
    domain: engine
    title: Deployed site facts match canonical business facts
    cadence: daily
    cost: free
    execution_mode: scheduled
    thesis_refs: [T6]
    instrument_ref: live-html-v1
    method:
      kind: engine
      run: |
        Fetch /api/business-facts from the live site and compare its source hash
        and public values with the canonical business-facts.yaml. Record every
        successful comparison, including a clean zero mismatch result.
    records:
      - {name: fact_mismatches, type: int}
    thresholds:
      - expr: fact_mismatches > 0
        severity: critical
        finding: "The deployed site contradicts canonical business-facts.yaml."
        action: "BLOCK publishing and regenerate every public fact surface before other site work."
    why: "Makes one-source-of-truth drift observable after deployment instead of trusting generated files locally."

  - id: engine.freshness
    domain: engine
    title: Observation freshness watchdog
    cadence: daily
    cost: free
    execution_mode: scheduled
    thesis_refs: [T1]
    instrument_ref: observation-series-v1
    method:
      kind: engine
      run: |
        Compare every time-scheduled check's newest committed observation to
        one complete cadence. Record the stalest observed age, how many checks
        exceed that limit, and every never-observed check.
    records:
      - {name: stalest_check_age_days, type: int}
      - {name: checks_overdue, type: int}
    thresholds:
      - expr: checks_overdue > 0
        severity: critical
        finding: "One or more observation streams reached a complete cadence without fresh evidence."
        action: "Treat the measurement loop as unhealthy until every overdue stream is restored or explicitly retired."
    why: "This watchdog turns a multi-day data blackout into a standing critical finding."

  # ───────────────────── BLOG / TOPICS ─────────────────────
  - id: topics.related_clusters
    domain: topics
    title: Related-topic and question discovery
    cadence: monthly
    cost: mcp
    # scheduled: `fmd-seo sync --source semrush` (sync.sync_due) has
    # fetched and recorded this autonomously since the Semrush adapters
    # landed. It was marked `session` while the cron was already producing
    # it, which kept it off the freshness watchdog. See brain/producers.yaml.
    execution_mode: scheduled
    thesis_refs: [T3]
    instrument_ref: semrush-keywords-v1
    method:
      kind: mcp
      run: |
        mcp__semrush__keyword_research for related keywords and questions around the
        service head terms. Record candidate topics with real measured volume only.
        NEVER invent or estimate a volume figure (GATE-4).
        While GATE-1 is CLOSED this check still runs — it builds the queue; it does
        not authorize writing.
    records:
      - {name: candidates_found, type: int}
      - {name: candidates_with_volume, type: int}
    thresholds:
      - expr: candidates_with_volume == 0
        severity: low
        finding: "No related topics with measured volume — topic exhaustion signal."
        action: "Switch to refresh/consolidation mode on existing pages rather than forcing thin new variations."
    why: "Feeds the topic queue for when GATE-1 opens. Discovery is safe while publishing is gated."

  - id: blog.cannibalization
    domain: blog
    title: Corpus duplication and cannibalization
    cadence: per_draft
    cost: free
    execution_mode: session
    thesis_refs: [T1]
    instrument_ref: observation-series-v1
    method:
      kind: engine
      run: |
        Compare the candidate draft against the existing corpus for exact
        duplicates, near-duplicates, and target-query overlap with an already
        published URL.
    records:
      - {name: exact_duplicates, type: int}
      - {name: near_duplicates, type: int}
      - {name: query_overlaps, type: int}
    thresholds:
      - expr: exact_duplicates > 0 or query_overlaps > 0
        severity: critical
        finding: "Draft cannibalizes an existing URL."
        action: "BLOCK. Update or consolidate the existing page instead of publishing a competitor to it."
    why: "Prevents the classic content-engine failure: two pages fighting for one query."
