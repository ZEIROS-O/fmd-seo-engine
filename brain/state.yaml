    detail: "'Drive Fresh' naming across social + directories; drivefreshdetail.com is Lou's own legacy domain."
    source: evidence/citation-sweep-2026-07-14.md
  - id: position-tracking-api-blocked
    detail: "Semrush Position Tracking configured but not readable over API as of 2026-07-14."
    source: evidence/site-audit-2026-07-14.md
