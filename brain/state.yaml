    detail: >-
      City-page reviews are reused across suburbs (Deborah + Mark Fisher on both
      Beachwood and Pepper Pike; Mark Michaels on both Solon and Pepper Pike).
      NEEDS OWNER CONFIRMATION — if these are real reviews placed on the wrong
      pages that is a trust problem; if invented it is a GATE-4 breach.
    source: evidence/baseline-2026-07-14.md
