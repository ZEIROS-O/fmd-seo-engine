# ── Gate state (machine-evaluated; do not hand-edit) ──
gates:
  GATE-1:
    name: publish-gate
    state: CLOSED
    reason: "not_indexed = 18 (>= 8). T1: publishing into a 14-page unindexed backlog dilutes crawl budget."
    opens_when: "not_indexed < 8 AND indexed >= 10, on two consecutive weekly readings"
    consecutive_clean_readings: 0
  GATE-2:
    name: suburb-page-gate
    state: CLOSED
    reason: "T3: 8 of 9 suburb pages target ZERO measured volume."
    opens_when: "a suburb clears >= 30/mo for car|auto|mobile detailing <suburb>"
  GATE-3:
    name: fact-gate
    state: ARMED
    reason: "Always armed. Every claim binds to the business-facts.yaml snapshot hash."
  GATE-4:
    name: no-invention-gate
    state: ARMED
    reason: "Always armed. No manufactured volumes, rankings, traffic, reviews, competitor facts, or imagery."

