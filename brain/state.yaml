known_issues:
  - id: ga4-no-key-event
    detail: >-
      GA4's "Key events by Platform" card reads "No data available" — there is
      NO booking/lead conversion event configured. AI-answer referral traffic is
      now measurable (2 chatgpt.com sessions on 2026-08-06) but its conversion
      is not, so every revenue claim about the channel stays owner-reported
      under GATE-4. Configuring a booking key event is the single highest-value
      analytics fix; without it the AEO channel cannot be optimised, only
      observed. Secondary: 100% bounce on both top pages with 11s average
      engagement indicates engagement/scroll events are also misconfigured.
    source: evidence/aeo-chatgpt-citation-2026-08-06/findings.json (2026-08-06)
  - id: aeo-review-floor
    detail: >-
      ChatGPT's 2026-08-06 Beachwood answer ranked three competitors carrying
      72 / 129 / 65 reviews and cited a review count for each. It cited NO count
      for FMD (16) and placed FMD as an unranked conditional pick. The observed
      floor for a ranked AI slot was 65 reviews; the observed floor for a local
      pack slot on 2026-08-03 was 37. Two independent surfaces, one gate.
      Review velocity (priority #1) is the lever on both.
    source: evidence/aeo-chatgpt-citation-2026-08-06/findings.json (2026-08-06)
  - id: gbp-anchor-unconfirmed
    detail: >-
      Local visibility centres on Mayfield Heights (rank 2-3) and decays to
      absent by Solon, while business-facts.yaml calls the base
      "Beachwood / Mayfield Heights". The GBP's actual registered address,
      service-area settings, primary category, and verification state have not
      been inspected. This determines the ring's centre and radius.
    source: brain/state.yaml#baseline.local_visibility (2026-08-03)
  - id: near-me-cluster-absent
    detail: >-
      The 'near me' cluster is ~2,350/mo (the largest measured demand) and FMD
      appears in it once, at rank 11, at the anchor. Absent at every other
      sampled location. Position tracking agrees: 0 of 123 near_me keywords
      ranked.
    source: brain/state.yaml#baseline.local_visibility (2026-08-03)
  - id: geogrid-query-set-misses-stronghold
    detail: >-
      config/engine.yaml geogrid.queries tests 'car detailing <suburb>' and
      'near me' shapes but never 'mobile detailing <suburb>', and its 5x5 grid
      never samples Mayfield Heights. It therefore reported absence for a
      business at rank 2. Superseded by seo.local_visibility; the geogrid query
      set still needs correcting or retiring.
    source: docs/incidents/2026-08-03-fixture-overwrote-evidence.md
  - id: chat-orphaned
    status: RETIRED 2026-08-11
    detail: >-
      /chat was in the sitemap with no internal links pointing to it. GSC URL
      Inspection on 2026-08-11 reports it "Submitted and indexed", so the crawl
      outcome this issue predicted did not occur. Internal linking may still be
      worth doing on its own merits; the indexation argument for it is closed.
    source: git c134e2e; brain/observations/seo.indexation/20260811T212717.553835+0000.json

  - id: coverage-state-collapses-unknown
    detail: >-
      `gsc.classify_coverage` maps "URL is unknown to Google" to the generic
      not_indexed bucket, so `seo.indexation` cannot distinguish a DISCOVERY
      failure (Google does not know the URL exists) from a CRAWL-BUDGET decision
      (Google found it and declined). Those need opposite fixes, and T1's whole
      argument rests on the second. 3 of 13 not-indexed URLs were in the first
      state on 2026-08-11. The fallback is safe but lossy; the record needs an
      unknown_to_google field.
    source: brain/observations/seo.indexation/20260811T212717.553835+0000.json

  - id: sitemap-carries-legal-boilerplate
    detail: >-
      /privacy-policy, /terms-of-service, and /cancellation-refund-policy sit in
      the sitemap, are not indexed, and have no search value. They inflate
      not_indexed by 3 (13 → 10) and make the indexation backlog look worse than
      the content backlog is. Removing them adds no URLs and does not open GATE-1.
    source: brain/observations/seo.indexation/20260811T212717.553835+0000.json

  - id: www-302-not-301
    detail: >-
      https://www.freshmobiledetail.com/ returns 302 (temporary) to the apex
      rather than 301 (permanent). GSC lists the www host as its own page at
      average position 201. The apex canonical tag is correct. Free fix, no new
      URLs, GATE-1-compatible.
    source: brain/state.yaml#current.canonical (2026-08-11)

  - id: ga4-service-account-unauthorized
    detail: >-
      The GSC service account (fmd-seo-engine@local-lead-machine-498016) has
      siteFullUser on the GSC property but NO access to GA4. Three separate
      blockers: the Analytics Admin/Data APIs are not enabled on Cloud project
      local-lead-machine-498016, the service account is not granted on the GA4
      property, and google-analytics-data is not installed. This is what keeps
      ga4-no-key-event unfixable from the engine side.
    source: analyticsadmin accounts.list -> HTTP 403 SERVICE_DISABLED, 2026-08-11
  - id: drive-fresh-contamination
    detail: "'Drive Fresh' naming across social + directories; drivefreshdetail.com is Lou's own legacy domain."
    source: evidence/citation-sweep-2026-07-14.md
  - id: position-tracking-api-blocked
    detail: "Semrush Position Tracking configured but not readable over API as of 2026-07-14."
    source: evidence/site-audit-2026-07-14.md
  - id: reused-suburb-reviews
    detail: >-
      City-page reviews are reused across suburbs (Deborah + Mark Fisher on both
      Beachwood and Pepper Pike; Mark Michaels on both Solon and Pepper Pike).
      NEEDS OWNER CONFIRMATION — if these are real reviews placed on the wrong
      pages that is a trust problem; if invented it is a GATE-4 breach.
    source: evidence/baseline-2026-07-14.md
