schema_version: 1

# DataForSEO may require a larger account deposit; this is the engine's bounded
# spend ceiling. The ledger accounts for all spend and reserves before posting.
# Measured per-call costs: serp $0.002 | llm_responses $0.0063 |
# business_data $0.0131 | llm_mentions $0.10 (50x a SERP — capped to zero).
budget:
  total_usd: 10.0
  endpoint_caps_usd:
    probe: 0.05
    keywords: 0.20      # Google Ads search volume: SAME price for 1 or 1000 keywords
                        # (~$0.075/request) — always batch to the 1000 limit.
    serp: 0.15          # ~75 SERP pulls (10 queries x desktop/mobile + listicles)
    serp_bulk: 0.60     # 467 keywords x depth 20 x $0.0006/page = <= $0.5604
    geogrid: 0.12       # 25 points x 8 queries x depth 10 x $0.0006 = $0.12
    llm_responses: 0.40 # ~63 AI answers (stable-core sampling + per-query citation SOV)
    business_data: 0.10 # ~7 local-listing pulls (GBP + competitors)
    labs: 0.10          # competitor ranked_keywords
    llm_mentions: 0.0   # DISABLED: $0.10/call. Baseline already captured in Phase 3;
                        # per-query citation SOV is measured via llm_responses instead.
    local_finder: 0.25  # Places-tab depth: 6 locations x 8 queries x $0.004 = $0.192.
                        # The 3-slot local pack cannot show rank 4+, so pack-only
                        # sampling reads "absent" for a business ranked 6.

paths:
  facts_file: "/mnt/c/Users/lucas/OneDrive/Documents/Cowork Detailing Folder/business-facts.yaml"
  operator_repo: "/home/lucascoh/operator-agent"
  zeiros_repo: "/home/lucascoh/ZEIROS"
  site_worktree: "/home/lucascoh/fmd-seo-engine/.worktrees/fresh-site-v3"
  position_keywords: "/home/lucascoh/fmd-seo-engine/evidence/keywords/position-tracking-keywords.txt"

creds_env: "/home/lucascoh/.dataforseo.env"

# Semrush REST API (the headless/cron fetch path — parallel to the MCP session
# path). Add `SEMRUSH_API_KEY=...` to creds_env to enable it; without the key
# the engine degrades to the session path and never fakes data. Semrush bills in
# API units, not USD — units_cap bounds a single `sync` run.
semrush:
  database: "us"
  units_cap: 500

# Google Search Console (the headless index-coverage path — removes the last
# human-bound check, seo.indexation, which is the GATE-1 input). Needs a Google
# service-account JSON key at key_path, added as a user on the GSC property, and
# the URL Inspection API enabled. Without the key/libs the engine degrades to the
# manual console reading and never guesses (GATE-4). See brain/README.md.
gsc:
  key_path: "/home/lucascoh/.gsc-service-account.json"
  site_url: "sc-domain:freshmobiledetail.com"
  sitemap_url: "https://freshmobiledetail.com/sitemap.xml"

# Google Analytics Data API, read-only. The property ID is the numeric GA4
# property ID, not the account, stream, or measurement ID. `sync` records a
# normalized acquisition/conversion observation at most once every seven days.
ga4:
  key_path: "/home/lucascoh/.gsc-service-account.json"
  property_id: "541970582"
  days: 28

site:
  facts_url: "https://freshmobiledetail.com/api/business-facts"
  fact_surfaces:
    - url: "https://freshmobiledetail.com/"
      required: [phoneDisplay, pricing.fullInterior, pricing.ultimateInterior]
    - url: "https://freshmobiledetail.com/interior-detailing"
      required: [phoneDisplay, pricing.fullInterior, pricing.ultimateInterior]
    - url: "https://freshmobiledetail.com/mobile-detailing"
      required: [phoneDisplay, pricing.fullInterior, pricing.ultimateInterior]
    - url: "https://freshmobiledetail.com/areas/beachwood"
      required: [phoneDisplay, pricing.fullInterior, pricing.ultimateInterior]

# Fixed-coordinate mobile position panel. Targets include FMD and the local
# competitors already present in the measured July baseline.
serp_bulk:
  coordinate: "41.4645,-81.5087,200"
  depth: 20
  page_price_usd: 0.0006
  head_terms:
    - car detailing
    - auto detailing
    - mobile detailing
    - car detailing near me
    - auto detailers near me
    - mobile detailing near me
    - best mobile car detailing cleveland
  targets:
    fmd:
      domain: freshmobiledetail.com
      aliases: [Fresh Mobile Detailing, Fresh Mobile Detail]
    atf:
      domain: allthingsfreshcardetailing.com
      aliases: [All Things Fresh Car Detailing, All Things Fresh]
    refresh:
      domain: refreshmobiledetailingcle.com
      aliases: [Refresh Mobile Detailing]
    nathans:
      domain: nathansdetailing.com
      aliases: [Nathan's Detailing, Nathans Detailing]
    diamond_finish:
      domain: diamondfinishdetailing.com
      aliases: [Diamond Finish Detailing, Diamond Finish]

# Places-tab depth sampling. The local pack has only 3 slots, so pack-only
# sampling reports "absent" for a business ranked 4-20. Measured 2026-08-03:
# FMD sits at rank 2-3 in Mayfield Heights, 6 in Beachwood, absent in Solon --
# a visibility ring, invisible to a 3-slot probe. `{suburb}` renders per location.
local_finder:
  depth: 20
  task_price_usd: 0.004
  queries:
    - "mobile detailing {suburb}"
    - "car detailing {suburb}"
    - "auto detailing {suburb}"
    - "interior car detailing {suburb}"
    - mobile detailing near me
    - car detailing near me
    - auto detailing near me
    - interior car detailing near me
  locations:
    - {name: Mayfield Heights, suburb: mayfield heights, latitude: 41.5192, longitude: -81.4390}
    - {name: Beachwood, suburb: beachwood, latitude: 41.4645, longitude: -81.5087}
    - {name: Lyndhurst, suburb: lyndhurst, latitude: 41.5209, longitude: -81.4885}
    - {name: Pepper Pike, suburb: pepper pike, latitude: 41.4581, longitude: -81.4557}
    - {name: Solon, suburb: solon, latitude: 41.3897, longitude: -81.4412}
    - {name: Shaker Heights, suburb: shaker heights, latitude: 41.4739, longitude: -81.5371}

geogrid:
  center: [41.4645, -81.5087]
  radius_miles: 6
  strongholds:
    - {name: Mayfield Heights, latitude: 41.5192, longitude: -81.4390}
  size: 5
  queries:
    - car detailing near me
    - mobile detailing near me
    - auto detailing near me
    - car detailing beachwood
    - car detailing solon
    - car detailing orange ohio
    - car detailing pepper pike
    - interior car detailing near me

# The unobfuscated GBP listing id must be supplied by Lou after API access is
# enabled. Empty means explicit no-op, never a guessed listing.
gbp:
  key_path: "/home/lucascoh/.gsc-service-account.json"
  location_id: ""
  days: 28

limits:
  attempts_per_milestone: 2
  worker_minutes: 45
  wall_minutes: 480
  systemic_failures_to_kill: 2
