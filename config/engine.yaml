schema_version: 1

# Balance is NOT replenishable: DataForSEO requires a $50 minimum deposit and
# the account holds $0.8786. total_usd is set so committed spend (which already
# includes $0.1214 from Phase 3) can never exceed the real balance.
# Measured per-call costs: serp $0.002 | llm_responses $0.0063 |
# business_data $0.0131 | llm_mentions $0.10 (50x a SERP — capped to zero).
budget:
  total_usd: 0.95
  endpoint_caps_usd:
    probe: 0.05
    keywords: 0.20      # Google Ads search volume: SAME price for 1 or 1000 keywords
                        # (~$0.075/request) — always batch to the 1000 limit.
    serp: 0.15          # ~75 SERP pulls (10 queries x desktop/mobile + listicles)
    llm_responses: 0.40 # ~63 AI answers (stable-core sampling + per-query citation SOV)
    business_data: 0.10 # ~7 local-listing pulls (GBP + competitors)
    labs: 0.10          # competitor ranked_keywords
    llm_mentions: 0.0   # DISABLED: $0.10/call. Baseline already captured in Phase 3;
                        # per-query citation SOV is measured via llm_responses instead.

paths:
  facts_file: "/mnt/c/Users/lucas/OneDrive/Documents/Cowork Detailing Folder/business-facts.yaml"
  fresh_repo: "/home/lucascoh/fresh-mobile-detailing"
  operator_repo: "/home/lucascoh/operator-agent"
  zeiros_repo: "/home/lucascoh/ZEIROS"
  site_worktree: "/home/lucascoh/fmd-seo-engine/.worktrees/fresh-site"

creds_env: "/home/lucascoh/.dataforseo.env"

limits:
  attempts_per_milestone: 2
  worker_minutes: 45
  wall_minutes: 480
  systemic_failures_to_kill: 2
