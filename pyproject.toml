[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fmd-seo-engine"
version = "0.1.0"
description = "Standalone SEO intelligence and content-package engine for Fresh Mobile Detailing"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
fmd-seo = "fmd_seo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
