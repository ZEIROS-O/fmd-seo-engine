[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fmd-seo-engine"
version = "0.1.0"
description = "Standalone SEO intelligence and content-package engine for Fresh Mobile Detailing"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

# GSC is opt-in: the core engine stays PyYAML-only. Install with
# `pip install -e .[gsc]` (or `pip install --user google-auth google-api-python-client`)
# to enable the headless index-coverage check via the URL Inspection API.
[project.optional-dependencies]
gsc = ["google-auth>=2.0", "google-api-python-client>=2.0"]
gbp = ["google-auth>=2.0", "requests>=2.0"]
ga4 = ["google-auth>=2.0", "requests>=2.0"]
google = ["google-auth>=2.0", "google-api-python-client>=2.0", "requests>=2.0"]

[project.scripts]
fmd-seo = "fmd_seo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
